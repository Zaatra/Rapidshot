[package]
name = "rapidshot-change-detection-benchmark"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rapidshot_cpu_default_benchmark"
path = "src/cpu_default_lib.rs"
crate-type = ["cdylib"]

[dependencies]
rapidshot-core = { path = "../../native/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
