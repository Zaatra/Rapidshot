[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rapidshot"
# Read from rapidshot/_version.py, which is the only place the number is
# written. Three copies used to be kept in step by hand; the release workflow
# checked each against the git tag but never against each other, so two could
# agree while the third drifted.
dynamic = ["version"]
description = "A high-performance screencapture library for Windows using Desktop Duplication API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "RapidShot Contributors", email = "imzaatra@gmail.com" }
]
maintainers = [
    { name = "Zaatra", email = "imzaatra@gmail.com" }
]
keywords = ["screencapture", "desktop-duplication", "screen-recorder", "windows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture"
]
dependencies = [
    "numpy>=1.19.0",
    "comtypes>=1.1.0",
]

[project.optional-dependencies]
cv2 = ["opencv-python>=4.5.0"]
# CuPy only. OpenCV was dropped from these extras in 2.3.0 because the code no
# longer uses it here: CupyProcessor used to convert colour by copying the frame
# off the GPU with `cp.asnumpy`, running cv2 on the CPU, and copying the result
# back -- three PCIe crossings on a path whose whole premise is GPU residency.
# Every mode is now expressed in CuPy and stays on the device, so installing
# 60+ MB of OpenCV alongside CuPy buys nothing. Add `[cv2]` if you want it for
# your own code.
#
# The suffix is the CUDA major version and must match your toolkit; the version
# specifier is CuPy's own, which is a different number and an easy one to
# conflate. CUDA 13 support arrived in CuPy 14. `gpu` remains CUDA 11 so that
# existing installs do not silently change wheels -- it is a compatibility
# alias, not a recommendation. Development runs CUDA 13.2 / CuPy 14.1.1.
gpu = ["cupy-cuda11x>=11.0.0"]
gpu_cuda12 = ["cupy-cuda12x>=12.0.0"]
gpu_cuda13 = ["cupy-cuda13x>=14.0.0"]
pil = ["pillow>=8.0.0"]
# The prebuilt native extension: the GPU tensor, cross-adapter transfer and the
# AVX2 conversion kernels without a Rust toolchain. Windows x86-64 only, which
# is the only platform Desktop Duplication runs on anyway.
#
# A lower bound rather than a pin: `rapidshot-native` versions independently,
# because the Rust changes on its own schedule and lockstep would republish an
# identical binary under a new number on every RapidShot release. Raise this
# floor when the Python side starts calling something the older wheel does not
# export.
native = ["rapidshot-native>=0.1.0; platform_system == 'Windows'"]
# Everything that is not CUDA-version-specific. The cupy-cudaNNx wheels are
# mutually exclusive, so none of them belongs in a catch-all extra -- pick
# `gpu`, `gpu_cuda12` or `gpu_cuda13` explicitly.
#
# `rapidshot-native` is deliberately NOT here until it has been published:
# naming an unpublished distribution in `all` would break `pip install
# rapidshot[all]` for everyone, immediately, to advertise a wheel that does not
# exist yet. Add it once the first native-v* tag has shipped -- RELEASING.md
# records the ordering.
all = [
    "opencv-python>=4.5.0",
    "pillow>=8.0.0",
]
dev = [
    "black>=22.3.0",
    "isort>=5.10.1", 
    "mypy>=0.950",
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "flake8>=4.0.1",
    "tox>=3.24.5",
]
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]

[project.urls]
"Homepage" = "https://github.com/Zaatra/Rapidshot"
"Bug Reports" = "https://github.com/Zaatra/Rapidshot/issues"
"Source" = "https://github.com/Zaatra/Rapidshot"
"Documentation" = "https://github.com/Zaatra/Rapidshot"

[tool.setuptools.dynamic]
# `attr` on a module with no imports: setuptools reads the literal out of the
# AST instead of importing rapidshot, which would need Windows COM present on
# the build machine.
version = { attr = "rapidshot._version.__version__" }

[tool.setuptools.packages.find]
# Must be discovery, not an explicit list. `packages = ["rapidshot"]` names only
# the top-level package, so the built wheel shipped five modules and none of
# rapidshot.core / .processor / .util / ._libs -- `pip install rapidshot`
# produced a package that raised ModuleNotFoundError on import. The failure was
# invisible from a source checkout, where the subpackages are simply on the path.
include = ["rapidshot*"]

[tool.setuptools.package-data]
# py.typed is what makes the annotations visible to type checkers downstream;
# without it PEP 561 says to ignore them, and every rapidshot symbol resolves
# to Any in the caller's editor.
#
# Deliberately NOT "*.pyd"/"*.so": a developer who has run
# native/install_dev.py has a compiled extension sitting in this directory, and
# that glob swept it into the wheel -- producing a py3-none-any wheel carrying a
# Windows-only binary built on whichever machine happened to cut the release.
# The extension is optional by design (see ROADMAP.md section 11) and is built
# by the consumer, never shipped. The release workflow fails if one appears.
rapidshot = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"