name: CodeQL

# Static analysis for the Python package. The Rust extension is covered by
# clippy in ci.yml; CodeQL has no Rust support, so this deliberately does not
# claim to analyse native/.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly, so newly published query packs find old code. A codebase that
    # passed last month is not guaranteed to pass today.
    - cron: "37 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
