[package]
name = "rapidshot-native"
# 0.2.0 adds GpuConverter (native/src/converter12.rs) and TensorTransfer
# (cross_adapter.rs), neither of which exists in 0.1.0. RapidShot 2.6 calls both,
# so `pyproject.toml`'s `native` extra floors at 0.2.0 and `rapidshot/native.py`
# names the required version when a symbol is missing.
version = "0.2.0"
edition = "2021"
# `as_chunks` (used by the scalar kernels in luma.rs / swizzle.rs)
# stabilised in 1.88. Clippy since 1.98 rejects the `chunks_exact`
# form it replaced under -D warnings, which is what set this floor.
rust-version = "1.88"
description = "Native GPU interop shim for Rapidshot (Stage 6)"
license = "MIT"

[lib]
name = "_rapidshot_native"
crate-type = ["cdylib"]

[dependencies]
# abi3-py39 builds one wheel that works on every supported Python version,
# matching the project's requires-python = ">=3.9", instead of one wheel per
# minor version. Python 3.8 is end-of-life and PyO3 has dropped it.
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
