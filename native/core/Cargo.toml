[package]
name = "rapidshot-core"
# Versioned with rapidshot-native, which is the only thing that publishes it.
version = "0.4.1"
edition = "2021"
rust-version = "1.88"
description = "Capture, conversion and transfer for RapidShot, with no Python in it"
license = "MIT"
publish = false

[lib]
name = "rapidshot_core"

[dependencies.windows]
version = "0.62"
features = [
    # Windows.Graphics.Capture (wgc.rs): the WinRT capture API, plus the
    # interop that makes its items from an HMONITOR/HWND and its device from
    # DXGI.
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
    # desktop.rs: which desktop is receiving input (lock screen, UAC, Session 0).
    "Win32_System_StationsAndDesktops",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
]

